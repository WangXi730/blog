site_name: 晴光的个人博客
site_description: 分享技术，记录成长
site_url: https://wxblog.com.cn
repo_url: https://github.com/WangXi730
repo_name: github

theme:
  name: material
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

nav:
  - 首页:
    - 首页: index.md
    - 架构: architecture.md
  - 解决方案架构:
      - 专栏首页: solution-architecture/index.md
      - 云上架构方法: solution-architecture/architectural-approach-on-the-cloud.md
  - Serverless:
    - 专栏首页: serverless/index.md
    - 静态网页: serverless/static_website.md
  - 实践:
    - 专栏首页: practice/index.md
    - 个人博客搭建: practice/blog.md
  - 关于: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WangXi730
